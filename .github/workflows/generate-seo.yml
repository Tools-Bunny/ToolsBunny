name: Generate Programmatic SEO Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute SEO Page Generator
        run: node build-seo.js

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seo-tools/ sitemap.xml
          git commit -m "Auto-generate programmatic SEO pages and sitemap" || exit 0
          git push
